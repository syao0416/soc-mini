[SERVICE]
    Flush             1
    Log_Level         info
    Parsers_File      /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Path              /docker-logs/*/*-json.log
    Tag               vm3.raw
    Parser            docker
    Read_from_Head    Off
    DB                /fluent-bit/state/tail.db

[FILTER]
    Name              grep
    Match             vm3.raw
    Regex             $attrs['log_source'] ^(apache|mariadb)$

[FILTER]
    Name              rewrite_tag
    Match             vm3.raw
    Rule              $attrs['log_source'] ^(apache|mariadb)$ vm3.$1 false

[OUTPUT]
    Name              forward
    Match             vm3.*
    Host              192.168.56.140
    Port              24224

[INPUT]
    Name              tail
    Path              /var/log/audit/audit.log
    Tag               vm3.auditd
    DB                /fluent-bit/state/auditd.db
    Read_From_Head    Off

[OUTPUT]
    Name          forward
    Match         vm3.apache
    Host          192.168.56.120
    Port          24225
