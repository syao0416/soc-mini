# compose.yaml
services:
  db:
    image: mariadb:10
    container_name: soc-db
    ports:
      - "127.0.0.1:13306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: socdb
      MARIADB_USER: student
      MARIADB_PASSWORD: p@ssw0rd
    volumes:
      - soc_db_data:/var/lib/mysql
    restart: unless-stopped

  fluent-bit:
    image: fluent/fluent-bit:3.2
    container_name: soc-fluent-bit
    ports:
      - "192.168.56.140:24224:24224"
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./logs:/logs 
    command: ["-c", "/fluent-bit/etc/fluent-bit.conf"]
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    container_name: soc-dashboard
    ports:
      - "192.168.56.140:5173:5173"
    depends_on:
      - api
    restart: unless-stopped
  
  api:
    build: ./dashboard/backend
    container_name: soc-api
    volumes:
      - /home/student/.soc-agent:/run/soc-agent:ro
    env_file:
      - ./dashboard/.env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: soc_dashboard
      DB_USER: soc_app
      DJANGO_DEBUG: "true"
    depends_on:
      - db
    command: >
       sh -c 'python manage.py migrate --noinput &&
       python manage.py runserver 0.0.0.0:8000'
    restart: unless-stopped

volumes:
  soc_db_data:
