
services:
  linux-target:
    image: ubuntu:24.04
    container_name: soc-linux-target
    command: ["sleep", "infinity"]
    networks:
      - soc-network

  web-target:
    image: nginx:alpine
    container_name: soc-web-target
    ports:
      - "8080:80"
    networks:
      - soc-network

  soc-server:
    image: python:3.12-slim
    container_name: soc-server
    command: ["sleep", "infinity"]
    working_dir: /app
    volumes:
      - ./app:/app
      - ./data:/data
    ports:
      - "8000:8000"
    networks:
      - soc-network

networks:
  soc-network:
    driver: bridge
