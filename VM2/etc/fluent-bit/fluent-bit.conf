[SERVICE]
    Flush             1
    Log_Level         info

[INPUT]
    Name              tail
    Path              /var/log/snort/snort.alert.fast
    Tag               vm2.snort
    Read_from_Head    On
    DB                /var/lib/fluent-bit/snort.db

[INPUT]
    Name              tail
    Path              /var/log/iptables.log
    Tag               vm2.iptables
    Read_from_Head    On
    DB                /var/lib/fluent-bit/iptables.db

[OUTPUT]
    Name              forward
    Match             vm2.*
    Host              192.168.56.140
    Port              24224

[INPUT]
    Name              tail
    Path              /var/log/audit/audit.log
    Tag               vm2.auditd
    DB                /var/lib/fluent-bit/auditd.db
    Read_From_Head    Off

[INPUT]
    Name          forward
    Listen        192.168.56.120
    Port          24225

[OUTPUT]
    Name          file
    Match         vm3.apache
    Path          /var/log
    File          dvwa-access.log
    Format        template
    Template      {log}
